apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quality-gate-prometheus-portforward
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quality-gate-prometheus-portforward
  namespace: monitoring
subjects:
  - kind: User
    name: arn:aws:sts::337112169365:assumed-role/cd-quality-gate-github-actions-role/GitHubActions
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: quality-gate-prometheus-portforward
  apiGroup: rbac.authorization.k8s.io
