baseUrl: https://grafana.g2mpt.com

dashboards:
  api-latency:
    uid: api-latency
    title: API Latency Dashboard
    variables:
      service: backend-api
      namespace: gympt-prod
    panels:
      errorRate: 12
      latency: 18
      podRestart: 24

  jvm-metrics:
    uid: jvm-metrics
    title: JVM Metrics Dashboard
    variables:
      service: backend-api
      namespace: gympt-prod
    panels:
      heapMemory: 12
      gc: 18
      threads: 24

  gpu-metrics:
    uid: gpu-metrics
    title: GPU Metrics Dashboard
    variables:
      namespace: posture-analysis
    panels:
      gpuUtilization: 12
      gpuMemory: 18

  redis-metrics:
    uid: redis-metrics
    title: Redis Metrics Dashboard
    variables:
      namespace: elasticache
    panels:
      connectedClients: 12
      memory: 18
      evictions: 24

  sqs-metrics:
    uid: sqs-metrics
    title: SQS Metrics Dashboard
    variables:
      namespace: monitoring
    panels:
      backlog: 12
      messageAge: 18
      dlq: 24

  eks-overview:
    uid: eks-overview
    title: EKS Cluster Overview
    variables:
      namespace: gympt-prod
    panels:
      cpu: 12
      memory: 18
      pods: 24

  athena-security-logs:
    uid: athena-security-logs
    title: Athena Security Logs
    variables:
      service: backend-api
      namespace: gympt-prod
    panels:
      alb5xx: 12
      wafBlocked: 18

  posture-analysis-service:
    uid: api-latency
    title: Posture Analysis Service Overview
    variables:
      service: posture-analysis-service
      namespace: gympt-prod
    panels:
      errorRate: 12
      latency: 18
      podRestart: 24

  worker-lambda:
    uid: sqs-metrics
    title: Worker Lambda Overview
    variables:
      service: worker-lambda
      namespace: gympt-prod
    panels:
      errorRate: 12
      latency: 18
      podRestart: 24
