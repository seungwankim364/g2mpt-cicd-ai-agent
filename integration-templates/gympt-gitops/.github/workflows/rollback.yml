name: Rollback Backend API Image Tag

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        required: true
      service:
        required: true
        default: backend-api
      environment:
        required: true
        default: prod
      current_image_tag:
        required: false
        default: unknown
      target_image_tag:
        required: true
        description: Image tag to roll back to
      approved_by:
        required: true
      reason:
        required: true
      values_file:
        required: false
        default: charts/backend-api/values-prod.yaml

jobs:
  rollback-values:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      VALUES_FILE: ${{ inputs.values_file }}
      TARGET_IMAGE_TAG: ${{ inputs.target_image_tag }}
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

    steps:
      - name: Checkout with existing GitOps PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_PAT }}

      - name: Validate rollback input
        run: |
          test "${{ inputs.service }}" = "backend-api"
          test "${{ inputs.environment }}" = "prod"
          test -n "$TARGET_IMAGE_TAG"
          test -n "$GITOPS_PAT"
          test -f "$VALUES_FILE"

      - name: Update values image tag
        run: |
          if command -v yq >/dev/null 2>&1; then
            TARGET_IMAGE_TAG="$TARGET_IMAGE_TAG" yq -i '.image.tag = strenv(TARGET_IMAGE_TAG)' "$VALUES_FILE"
          else
            sed -i.bak -E "s#(tag:[[:space:]]*).+#\\1\"${TARGET_IMAGE_TAG}\"#" "$VALUES_FILE"
            rm -f "$VALUES_FILE.bak"
          fi

      - name: Commit rollback tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No GitOps rollback change to commit"
            exit 0
          fi

          git add "$VALUES_FILE"
          git commit -m "rollback: backend-api prod image to $TARGET_IMAGE_TAG"
          git push origin HEAD:main

      - name: Write rollback record
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          record = {
              "deploymentId": "${{ inputs.deployment_id }}",
              "service": "${{ inputs.service }}",
              "environment": "${{ inputs.environment }}",
              "currentImageTag": "${{ inputs.current_image_tag }}",
              "targetImageTag": "${{ inputs.target_image_tag }}",
              "approvedBy": "${{ inputs.approved_by }}",
              "reason": "${{ inputs.reason }}",
              "valuesFile": "${{ inputs.values_file }}",
              "completedAt": datetime.now(timezone.utc).isoformat(),
              "status": "gitops_values_updated"
          }
          open("rollback-result.json", "w", encoding="utf-8").write(json.dumps(record, indent=2) + "\n")
          PY

      - name: Upload rollback record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-result
          path: rollback-result.json
