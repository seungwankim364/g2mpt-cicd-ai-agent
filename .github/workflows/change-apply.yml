name: Execute Approved Change

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        required: true
      service:
        required: true
        default: backend-api
      environment:
        required: true
        default: prod
      action_type:
        required: true
        default: change
      approved_by:
        required: true
      reason:
        required: true
      current_image_tag:
        required: false
        default: unknown
      target_image_tag:
        required: false
        default: ""
      app_repo:
        required: false
        default: hj-3/gympt-app
      app_workflow:
        required: false
        default: backend-api-ci.yml
      app_ref:
        required: false
        default: main

jobs:
  change-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    env:
      GITOPS_REPO: hj-3/gympt-gitops
      GITOPS_PAT: ${{ secrets.GH_WORKFLOW_DISPATCH_TOKEN }}
      VALUES_FILE: charts/backend-api/values-prod.yaml
      APP_REPO: ${{ inputs.app_repo }}
      APP_WORKFLOW: ${{ inputs.app_workflow }}
      APP_REF: ${{ inputs.app_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate change approval
        run: |
          case "${{ inputs.action_type }}" in
            change|manual_fix|restart_deployment|scale_replicas|increase_memory|increase_hpa|open_fix_issue|open_change_pr)
              ;;
            *)
              echo "Unsupported action_type: ${{ inputs.action_type }}" >&2
              exit 2
              ;;
          esac

      - name: Create change execution record
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          record = {
              "deploymentId": "${{ inputs.deployment_id }}",
              "service": "${{ inputs.service }}",
              "environment": "${{ inputs.environment }}",
              "actionType": "${{ inputs.action_type }}",
              "approvedBy": "${{ inputs.approved_by }}",
              "reason": "${{ inputs.reason }}",
              "currentImageTag": "${{ inputs.current_image_tag }}",
              "targetImageTag": "${{ inputs.target_image_tag }}",
              "appRepo": "${{ inputs.app_repo }}",
              "appWorkflow": "${{ inputs.app_workflow }}",
              "appRef": "${{ inputs.app_ref }}",
              "startedAt": datetime.now(timezone.utc).isoformat(),
              "status": "approved_runbook_started",
              "nextExecutor": "GitOps patch runbook or issue workflow selected by actionType"
          }
          open("change-apply-execution.json", "w", encoding="utf-8").write(json.dumps(record, indent=2) + "\n")
          PY

      - name: Create GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[Approved Change] ${{ inputs.service }} ${{ inputs.deployment_id }}" \
            --body-file change-apply-execution.json \
            --label "cd-quality-gate" \
            --label "approved-change" || true

      - name: Execute approved GitOps runbook
        if: ${{ contains('restart_deployment,scale_replicas,increase_memory,increase_hpa', inputs.action_type) }}
        run: |
          case "${{ inputs.action_type }}" in
            restart_deployment)
              YAML_PATH="podAnnotations.cd-quality-gate/restartedAt" \
              YAML_VALUE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              YAML_VALUE_TYPE="string" \
              COMMIT_MESSAGE="ci: restart backend-api prod deployment" \
              scripts/cd/update-gitops-yaml-value.sh
              ;;
            scale_replicas)
              YAML_PATH="autoscaling.minReplicas" \
              YAML_VALUE="2" \
              YAML_VALUE_TYPE="number" \
              COMMIT_MESSAGE="ci: scale backend-api prod minimum replicas" \
              scripts/cd/update-gitops-yaml-value.sh
              ;;
            increase_memory)
              YAML_PATH="resources.requests.memory" \
              YAML_VALUE="2Gi" \
              YAML_VALUE_TYPE="string" \
              COMMIT_MESSAGE="ci: increase backend-api prod memory request" \
              scripts/cd/update-gitops-yaml-value.sh
              YAML_PATH="resources.limits.memory" \
              YAML_VALUE="3Gi" \
              YAML_VALUE_TYPE="string" \
              COMMIT_MESSAGE="ci: increase backend-api prod memory limit" \
              scripts/cd/update-gitops-yaml-value.sh
              ;;
            increase_hpa)
              YAML_PATH="autoscaling.maxReplicas" \
              YAML_VALUE="30" \
              YAML_VALUE_TYPE="number" \
              COMMIT_MESSAGE="ci: increase backend-api prod hpa max replicas" \
              scripts/cd/update-gitops-yaml-value.sh
              ;;
          esac

      - name: Upload change execution record
        uses: actions/upload-artifact@v4
        with:
          name: change-apply-execution
          path: change-apply-execution.json
