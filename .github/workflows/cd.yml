name: CD

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service name
        required: true
        default: backend-api
      environment:
        description: Deployment environment
        required: true
        default: prod
      image_tag:
        description: Image tag to deploy
        required: true
        default: 337112169365.dkr.ecr.ap-northeast-2.amazonaws.com/gympt-prod/backend-api:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SERVICE_NAME: ${{ inputs.service }}
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
      VALUES_FILE: charts/backend-api/values-prod.yaml
      ARGOCD_APP: backend-api-prod
      K8S_DEPLOYMENT: backend-api-prod
      K8S_NAMESPACE: gympt-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update GitOps image tag
        run: scripts/cd/update-gitops-image-tag.sh

      - name: Wait Argo CD application
        run: scripts/cd/wait-argocd-app.sh

      - name: Check Kubernetes rollout
        run: scripts/cd/check-k8s-rollout.sh

  quality-gate:
    needs: deploy
    uses: ./.github/workflows/quality-gate.yml
    with:
      service: ${{ inputs.service }}
      environment: ${{ inputs.environment }}
      namespace: gympt-prod
      deployment: backend-api-prod
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
