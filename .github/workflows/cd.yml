name: Post Deploy Quality Gate

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service name
        required: true
        default: backend-api
      environment:
        description: Deployment environment
        required: true
        default: prod
      namespace:
        description: Kubernetes namespace already deployed by Argo CD
        required: true
        default: gympt-prod
      deployment:
        description: Kubernetes deployment already deployed by Argo CD
        required: true
        default: backend-api-prod
      image_tag:
        description: Image tag deployed by existing app CI/CD
        required: true
        default: 337112169365.dkr.ecr.ap-northeast-2.amazonaws.com/gympt-prod/backend-api:latest

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml
    with:
      service: ${{ inputs.service }}
      environment: ${{ inputs.environment }}
      namespace: ${{ inputs.namespace }}
      deployment: ${{ inputs.deployment }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
