name: Quality Gate

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        required: true
        type: string
      namespace:
        required: true
        type: string
      deployment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      PROMETHEUS_URL:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      AWS_ROLE_ARN:
        required: false
  workflow_dispatch:
    inputs:
      service:
        required: true
        default: backend-api
      environment:
        required: true
        default: prod
      namespace:
        required: true
        default: gympt-prod
      deployment:
        required: true
        default: backend-api-prod
      image_tag:
        required: true
        default: 337112169365.dkr.ecr.ap-northeast-2.amazonaws.com/gympt-prod/backend-api:latest
      prometheus_url:
        required: false
        default: http://127.0.0.1:9090
      grafana_url:
        required: false
        default: http://127.0.0.1:3000
      argocd_url:
        required: false
        default: https://127.0.0.1:8080

jobs:
  quality-gate:
    runs-on: [self-hosted, linux, eks]
    permissions:
      contents: read
      id-token: write

    env:
      SERVICE_NAME: ${{ inputs.service }}
      ENVIRONMENT: ${{ inputs.environment }}
      NAMESPACE: ${{ inputs.namespace }}
      DEPLOYMENT: ${{ inputs.deployment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      ALERT_NAMES: BackendHighErrorRate,BackendHighLatency,BackendPodRestarting,BackendDBPoolExhaustion,BackendHighMemoryUsage,SQSQueueBacklog,SQSMessageAge,SQSDLQMessages,NodeHighCPUUsage,PodRestartFrequent,GPUHighUtilization,GPUMemoryHigh,RedisConnectionError,RedisHighMemory,RedisHighEvictionRate,BedrockHighErrorRate,BedrockThrottling
      MONITORED_NAMESPACES: gympt-prod,monitoring,posture-analysis,elasticache
      PROMETHEUS_URL: ${{ inputs.prometheus_url || secrets.PROMETHEUS_URL }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EVENT_BUS_NAME: cd-quality-gate-prod-bus
      AWS_REGION: ap-northeast-2
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_CHANNEL: "#cd-deploy-alarm"
      GRAFANA_URL: ${{ inputs.grafana_url || 'https://grafana.g2mpt.com' }}
      ARGOCD_URL: ${{ inputs.argocd_url || 'https://argocd.g2mpt.com' }}
      ARGOCD_APP: backend-api-prod
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HEALTH_CHECK_WINDOW_SECONDS: 120
      HEALTH_CHECK_INTERVAL_SECONDS: 60
      CLOUDWATCH_ENABLED: "true"
      CLOUDWATCH_REQUIRED: "true"
      AWS_HEALTH_CONFIG_FILE: config/quality-gate/aws-health-check.json

    steps:
      - name: Checkout CD Quality Gate repository
        uses: actions/checkout@v4
        with:
          repository: seungwankim364/g2mpt-cicd-ai-agent
          ref: main

      - name: Configure AWS credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Kubernetes rollout
        env:
          K8S_NAMESPACE: ${{ inputs.namespace }}
          K8S_DEPLOYMENT: ${{ inputs.deployment }}
          EXPECTED_IMAGE: ${{ inputs.image_tag }}
        run: scripts/cd/check-k8s-rollout.sh

      - name: Run 5-minute health check window
        id: evaluate
        continue-on-error: true
        run: scripts/quality-gate/run-health-check-window.sh

      - name: Build Grafana links
        run: |
          scripts/quality-gate/build-grafana-links.py \
            --base-url "$GRAFANA_URL" \
            --dashboard-uid "api-latency" \
            --dashboard-uid "eks-overview" \
            --dashboard-uid "jvm-metrics" \
            --dashboard-uid "gpu-metrics" \
            --dashboard-uid "redis-metrics" \
            --dashboard-uid "sqs-metrics" \
            --service "$SERVICE_NAME" \
            --namespace "$NAMESPACE" \
            --prometheus-url "$PROMETHEUS_URL" \
            --argocd-url "$ARGOCD_URL" \
            --argocd-app "$ARGOCD_APP" \
            --output-file grafana-links.json

      - name: Send Slack first alert
        if: steps.evaluate.outcome == 'failure'
        continue-on-error: true
        run: |
          scripts/quality-gate/send-slack-first-alert.py \
            --result-file quality-gate-result.json \
            --links-file grafana-links.json \
            --output-file slack-first-alert.json

      - name: Resolve rollback image tag
        if: steps.evaluate.outcome == 'failure'
        continue-on-error: true
        env:
          K8S_NAMESPACE: ${{ inputs.namespace }}
          K8S_DEPLOYMENT: ${{ inputs.deployment }}
          CURRENT_IMAGE: ${{ inputs.image_tag }}
        run: |
          rollback_image="$(scripts/cd/find-previous-k8s-image.sh || true)"
          if [ -n "$rollback_image" ]; then
            echo "ROLLBACK_IMAGE_TAG=$rollback_image" >> "$GITHUB_ENV"
            echo "Resolved rollback image: $rollback_image"
          else
            echo "Could not resolve rollback image from previous ReplicaSet."
          fi

      - name: Send Slack deploy complete alert
        if: steps.evaluate.outcome == 'success'
        continue-on-error: true
        run: |
          scripts/quality-gate/send-slack-deploy-success.py \
            --service "$SERVICE_NAME" \
            --namespace "$NAMESPACE" \
            --image-tag "$IMAGE_TAG" \
            --output-file slack-deploy-success.json

      - name: Publish EventBridge DeploymentFailed event
        if: steps.evaluate.outcome == 'failure'
        env:
          QUALITY_GATE_RESULT_FILE: quality-gate-result.json
          GRAFANA_LINKS_FILE: grafana-links.json
        run: scripts/quality-gate/publish-eventbridge-event.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate
          path: |
            prometheus-alerts.json
            prometheus-alerts-*.json
            prometheus-metrics.json
            prometheus-metrics-*.json
            cloudwatch-alarms.json
            cloudwatch-alarms-*.json
            cloudwatch-metrics.json
            cloudwatch-metrics-*.json
            quality-gate-result.json
            quality-gate-result-*.json
            quality-gate-window-result.json
            grafana-links.json
            slack-first-alert.json
            slack-deploy-success.json
            deployment-failed-event.json
          if-no-files-found: ignore

      - name: Fail job when Quality Gate failed
        if: steps.evaluate.outcome == 'failure'
        run: exit 1
