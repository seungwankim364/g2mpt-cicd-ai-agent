name: Execute DR Failover

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        required: true
      service:
        required: true
        default: backend-api
      environment:
        required: true
        default: prod
      action_type:
        required: true
        default: dr
      approved_by:
        required: true
      reason:
        required: true
      current_image_tag:
        required: false
        default: unknown
      target_image_tag:
        required: false
        default: ""
      target_repo:
        required: false
        default: hj-3/gympt-gitops
        description: Repository that owns DR failover workflow and required AWS/GitOps permissions
      target_workflow:
        required: false
        default: dr-failover.yml
        description: Workflow file in target_repo that performs DR failover
      app_repo:
        required: false
        default: hj-3/gympt-app
      app_workflow:
        required: false
        default: backend-api-ci.yml
      app_ref:
        required: false
        default: main

jobs:
  request-dr-failover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    env:
      TARGET_REPO: ${{ inputs.target_repo }}
      TARGET_WORKFLOW: ${{ inputs.target_workflow }}
      GITOPS_REPO: hj-3/gympt-gitops
      GITOPS_PAT: ${{ secrets.GH_WORKFLOW_DISPATCH_TOKEN }}
      DR_VALUES_FILE: ${{ vars.DR_VALUES_FILE }}
      DR_YAML_PATH: ${{ vars.DR_YAML_PATH }}
      DR_TARGET_VALUE: ${{ vars.DR_TARGET_VALUE }}
      DR_TARGET_VALUE_TYPE: ${{ vars.DR_TARGET_VALUE_TYPE }}
      APP_REPO: ${{ inputs.app_repo }}
      APP_WORKFLOW: ${{ inputs.app_workflow }}
      APP_REF: ${{ inputs.app_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DR approval
        run: |
          test "${{ inputs.action_type }}" = "dr"

      - name: Create DR request record
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          record = {
              "deploymentId": "${{ inputs.deployment_id }}",
              "service": "${{ inputs.service }}",
              "environment": "${{ inputs.environment }}",
              "actionType": "dr",
              "approvedBy": "${{ inputs.approved_by }}",
              "reason": "${{ inputs.reason }}",
              "currentImageTag": "${{ inputs.current_image_tag }}",
              "targetRepo": "${{ inputs.target_repo }}",
              "targetWorkflow": "${{ inputs.target_workflow }}",
              "drValuesFile": "${{ vars.DR_VALUES_FILE }}",
              "drYamlPath": "${{ vars.DR_YAML_PATH }}",
              "drTargetValue": "${{ vars.DR_TARGET_VALUE }}",
              "appRepo": "${{ inputs.app_repo }}",
              "appWorkflow": "${{ inputs.app_workflow }}",
              "appRef": "${{ inputs.app_ref }}",
              "startedAt": datetime.now(timezone.utc).isoformat(),
              "status": "dr_approved",
              "nextExecutor": "GitOps DR failover patch if DR_VALUES_FILE/DR_YAML_PATH/DR_TARGET_VALUE are configured"
          }
          open("dr-failover-request.json", "w", encoding="utf-8").write(json.dumps(record, indent=2) + "\n")
          PY

      - name: Execute DR GitOps failover patch
        if: ${{ vars.DR_VALUES_FILE != '' && vars.DR_YAML_PATH != '' && vars.DR_TARGET_VALUE != '' }}
        env:
          VALUES_FILE: ${{ vars.DR_VALUES_FILE }}
          YAML_PATH: ${{ vars.DR_YAML_PATH }}
          YAML_VALUE: ${{ vars.DR_TARGET_VALUE }}
          YAML_VALUE_TYPE: ${{ vars.DR_TARGET_VALUE_TYPE || 'string' }}
          COMMIT_MESSAGE: "ci: execute approved DR failover for ${{ inputs.service }} ${{ inputs.environment }}"
        run: scripts/cd/update-gitops-yaml-value.sh

      - name: Create GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$DR_VALUES_FILE" ] && [ -n "$DR_YAML_PATH" ] && [ -n "$DR_TARGET_VALUE" ]; then
            title="[DR Executed] ${{ inputs.service }} ${{ inputs.deployment_id }}"
          else
            title="[DR Review] ${{ inputs.service }} ${{ inputs.deployment_id }}"
          fi
          gh issue create \
            --title "$title" \
            --body-file dr-failover-request.json \
            --label "cd-quality-gate" \
            --label "dr" || true

      - name: Upload DR request record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-failover-request
          path: dr-failover-request.json
