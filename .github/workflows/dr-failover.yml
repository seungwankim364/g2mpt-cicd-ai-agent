name: Execute DR Failover

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        required: true
      service:
        required: true
        default: backend-api
      environment:
        required: true
        default: prod
      action_type:
        required: true
        default: dr
      approved_by:
        required: true
      reason:
        required: true
      current_image_tag:
        required: false
        default: unknown
      target_image_tag:
        required: false
        default: ""
      target_repo:
        required: false
        default: hj-3/gympt-gitops
        description: Repository that owns DR failover workflow and required AWS/GitOps permissions
      target_workflow:
        required: false
        default: dr-failover.yml
        description: Workflow file in target_repo that performs DR failover
      app_repo:
        required: false
        default: hj-3/gympt-app
      app_workflow:
        required: false
        default: backend-api-ci.yml
      app_ref:
        required: false
        default: main

jobs:
  request-dr-failover:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TARGET_REPO: ${{ inputs.target_repo }}
      TARGET_WORKFLOW: ${{ inputs.target_workflow }}
      DISPATCH_TOKEN: ${{ secrets.GH_WORKFLOW_DISPATCH_TOKEN }}
      APP_REPO: ${{ inputs.app_repo }}
      APP_WORKFLOW: ${{ inputs.app_workflow }}
      APP_REF: ${{ inputs.app_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DR approval
        run: |
          test "${{ inputs.action_type }}" = "dr"
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "GH_WORKFLOW_DISPATCH_TOKEN is required to call the existing DR failover workflow." >&2
            exit 2
          fi

      - name: Create DR request record
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          record = {
              "deploymentId": "${{ inputs.deployment_id }}",
              "service": "${{ inputs.service }}",
              "environment": "${{ inputs.environment }}",
              "actionType": "dr",
              "approvedBy": "${{ inputs.approved_by }}",
              "reason": "${{ inputs.reason }}",
              "currentImageTag": "${{ inputs.current_image_tag }}",
              "targetRepo": "${{ inputs.target_repo }}",
              "targetWorkflow": "${{ inputs.target_workflow }}",
              "startedAt": datetime.now(timezone.utc).isoformat(),
              "status": "dispatching_existing_dr_failover_workflow"
          }
          open("dr-failover-request.json", "w", encoding="utf-8").write(json.dumps(record, indent=2) + "\n")
          PY

      - name: Dispatch existing DR failover workflow
        run: |
          scripts/github/dispatch-workflow.py \
            --repo "$TARGET_REPO" \
            --workflow "$TARGET_WORKFLOW" \
            --ref main \
            --token "$DISPATCH_TOKEN" \
            --input "deployment_id=${{ inputs.deployment_id }}" \
            --input "service=${{ inputs.service }}" \
            --input "environment=${{ inputs.environment }}" \
            --input "current_image_tag=${{ inputs.current_image_tag }}" \
            --input "target_image_tag=${{ inputs.target_image_tag }}" \
            --input "approved_by=${{ inputs.approved_by }}" \
            --input "reason=${{ inputs.reason }}"

      - name: Dispatch gympt-app deployment workflow
        run: |
          scripts/github/dispatch-workflow.py \
            --repo "$APP_REPO" \
            --workflow "$APP_WORKFLOW" \
            --ref "$APP_REF" \
            --token "$DISPATCH_TOKEN" \
            --input "service=${{ inputs.service }}" \
            --input "environment=${{ inputs.environment }}" \
            --input "image_tag=${{ inputs.target_image_tag }}" \
            --input "source_action=dr" \
            --input "deployment_id=${{ inputs.deployment_id }}"

      - name: Upload DR request record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-failover-request
          path: dr-failover-request.json
