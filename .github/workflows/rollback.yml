name: Execute Rollback

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        required: true
        description: Deployment id from AI analysis
      service:
        required: true
        default: backend-api
      environment:
        required: true
        default: prod
      action_type:
        required: true
        default: rollback
      approved_by:
        required: true
      reason:
        required: true
      current_image_tag:
        required: false
        default: unknown
      target_image_tag:
        required: true
        description: Image tag to roll back to
      target_repo:
        required: false
        default: hj-3/gympt-gitops
        description: GitOps repository to update directly
      values_file:
        required: false
        default: charts/backend-api/values-prod.yaml
        description: Helm values file to update

jobs:
  request-rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TARGET_REPO: ${{ inputs.target_repo }}
      VALUES_FILE: ${{ inputs.values_file }}
      GITOPS_PAT: ${{ secrets.GH_WORKFLOW_DISPATCH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate rollback approval
        run: |
          test "${{ inputs.action_type }}" = "rollback"
          test -n "${{ inputs.target_image_tag }}"
          if [ -z "$GITOPS_PAT" ]; then
            echo "GH_WORKFLOW_DISPATCH_TOKEN is required to push rollback tag to GitOps repository." >&2
            exit 2
          fi

      - name: Write rollback request record
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          record = {
              "deploymentId": "${{ inputs.deployment_id }}",
              "service": "${{ inputs.service }}",
              "environment": "${{ inputs.environment }}",
              "actionType": "rollback",
              "approvedBy": "${{ inputs.approved_by }}",
              "reason": "${{ inputs.reason }}",
              "currentImageTag": "${{ inputs.current_image_tag }}",
              "targetImageTag": "${{ inputs.target_image_tag }}",
              "targetRepo": "${{ inputs.target_repo }}",
              "valuesFile": "${{ inputs.values_file }}",
              "startedAt": datetime.now(timezone.utc).isoformat(),
              "status": "updating_gitops_values_tag"
          }
          open("rollback-request.json", "w", encoding="utf-8").write(json.dumps(record, indent=2) + "\n")
          PY

      - name: Update GitOps values image tag
        run: |
          SERVICE_NAME="${{ inputs.service }}" \
          ENVIRONMENT="${{ inputs.environment }}" \
          IMAGE_TAG="${{ inputs.target_image_tag }}" \
          GITOPS_REPO="$TARGET_REPO" \
          GITOPS_PAT="$GITOPS_PAT" \
          VALUES_FILE="$VALUES_FILE" \
          scripts/cd/update-gitops-image-tag.sh

      - name: Upload rollback request record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-request
          path: rollback-request.json
