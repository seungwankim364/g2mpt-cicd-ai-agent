name: Execute Manual Fix Request

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        required: true
      service:
        required: true
        default: backend-api
      environment:
        required: true
        default: prod
      action_type:
        required: true
        default: manual_fix
      approved_by:
        required: true
      reason:
        required: true
      current_image_tag:
        required: false
        default: unknown
      target_image_tag:
        required: false
        default: ""
      app_repo:
        required: false
        default: hj-3/gympt-app
      app_workflow:
        required: false
        default: backend-api-ci.yml
      app_ref:
        required: false
        default: main

jobs:
  manual-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    env:
      APP_REPO: ${{ inputs.app_repo }}
      APP_WORKFLOW: ${{ inputs.app_workflow }}
      APP_REF: ${{ inputs.app_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manual fix approval
        run: |
          case "${{ inputs.action_type }}" in
            manual_fix|open_fix_issue)
              ;;
            *)
              echo "Unsupported action_type: ${{ inputs.action_type }}" >&2
              exit 2
              ;;
          esac

      - name: Create manual fix record
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          record = {
              "deploymentId": "${{ inputs.deployment_id }}",
              "service": "${{ inputs.service }}",
              "environment": "${{ inputs.environment }}",
              "actionType": "${{ inputs.action_type }}",
              "approvedBy": "${{ inputs.approved_by }}",
              "reason": "${{ inputs.reason }}",
              "currentImageTag": "${{ inputs.current_image_tag }}",
              "targetImageTag": "${{ inputs.target_image_tag }}",
              "appRepo": "${{ inputs.app_repo }}",
              "appWorkflow": "${{ inputs.app_workflow }}",
              "appRef": "${{ inputs.app_ref }}",
              "startedAt": datetime.now(timezone.utc).isoformat(),
              "status": "fix_issue_requested",
              "nextExecutor": "create and merge the fix in the app repo, then let normal CI/CD restart from gympt-app"
          }
          open("manual-fix-request.json", "w", encoding="utf-8").write(json.dumps(record, indent=2) + "\n")
          PY

      - name: Create GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[Manual Fix] ${{ inputs.service }} ${{ inputs.deployment_id }}" \
            --body-file manual-fix-request.json \
            --label "cd-quality-gate" \
            --label "manual-fix" || true

      - name: Upload manual fix record
        uses: actions/upload-artifact@v4
        with:
          name: manual-fix-request
          path: manual-fix-request.json
